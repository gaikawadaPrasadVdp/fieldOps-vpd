# ==============================================================================
# SonarCloud Configuration for FieldOps Nexus
# ==============================================================================

# Project Identification
# NOTE: Replace with your actual SonarCloud projectKey and organization
# (Found in SonarCloud -> Project Information)
sonar.projectKey=VPDTechnologies_FieldOps_Nexus_Internal
sonar.organization=vpdtechnologies

sonar.projectName=FieldOps_Nexus_Internal
sonar.projectVersion=0.1.0

# ------------------------------------------------------------------------------
# Source & Test Paths
# ------------------------------------------------------------------------------
sonar.sources=src
sonar.tests=tests

# ------------------------------------------------------------------------------
# Python Version & Coverage Configuration
# ------------------------------------------------------------------------------
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# ------------------------------------------------------------------------------
# File Exclusions from Full Analysis
# (Exclude non-application assets, documentation, QA reports, migrations, and scripts)
# ------------------------------------------------------------------------------
sonar.exclusions=\
  src/static/**,\
  src/templates/**,\
  **/migrations/**,\
  docs/**,\
  deploy/**,\
  qa/**,\
  qa_reports/**,\
  scripts/**,\
  *.md,\
  *.sqlite3,\
  *.db

# ------------------------------------------------------------------------------
# Code Coverage Exclusions
# (Exclude boilerplate, configurations, migrations, admin, and management commands
# so your coverage percentage accurately reflects core business/domain logic)
# ------------------------------------------------------------------------------
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/management/**,\
  src/config/**,\
  **/admin.py,\
  **/apps.py,\
  **/*forms*.py

# ------------------------------------------------------------------------------
# Code Duplication (CPD) Exclusions
# ------------------------------------------------------------------------------
sonar.cpd.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/management/**

# ------------------------------------------------------------------------------
# Multi-criteria Issue Suppression
# ------------------------------------------------------------------------------
# e1: Ignore python:S3752 (HTTP method check) on view files (handled via Django REST Framework decorators/routing)
# e2: Ignore python:S2068 (hardcoded credential false positive) in management commands/seed data
sonar.issue.ignore.multicriteria=e1,e2

sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3752
sonar.issue.ignore.multicriteria.e1.resourceKey=src/apps/**/views.py,src/apps/**/api_views.py

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=src/apps/**/management/**

# ------------------------------------------------------------------------------
# Source Encoding
# ------------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
