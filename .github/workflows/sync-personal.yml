name: Sync Organization Dev to Personal Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Organization Dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Push to Personal Repository
        env:
          UPDATE_VPD: ${{ secrets.UPDATE_VPD }}
        run: |
          git push https://x-access-token:${UPDATE_VPD}@github.com/gaikawadaPrasadVdp/fieldOps-vpd.git HEAD:main