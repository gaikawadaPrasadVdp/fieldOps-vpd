{# Reusable Skeleton Card Loader for Grids, Cockpits & Workspaces #}
<div class="fx-skeleton-card" aria-hidden="true">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="fx-skeleton fx-skeleton-badge"></div>
    <div class="fx-skeleton fx-skeleton-text" style="width: 25%; margin-bottom: 0;"></div>
  </div>
  <div class="fx-skeleton fx-skeleton-title"></div>
  <div class="fx-skeleton fx-skeleton-text" style="width: 90%;"></div>
  <div class="fx-skeleton fx-skeleton-text" style="width: 75%;"></div>
  <div class="d-flex align-items-center justify-content-between mt-4 pt-2 border-top border-secondary border-opacity-10">
    <div class="d-flex align-items-center gap-2">
      <div class="fx-skeleton fx-skeleton-avatar" style="width: 1.75rem; height: 1.75rem;"></div>
      <div class="fx-skeleton fx-skeleton-text" style="width: 5rem; margin-bottom: 0;"></div>
    </div>
    <div class="fx-skeleton fx-skeleton-btn" style="width: 4.5rem; height: 1.75rem;"></div>
  </div>
</div>
