{# Reusable Skeleton Table Rows Loader for Tabular Dashboards #}
{% for i in "12345" %}
<tr class="fx-skeleton-table-row-container" aria-hidden="true">
  <td><div class="fx-skeleton fx-skeleton-text" style="width: 70%;"></div></td>
  <td><div class="fx-skeleton fx-skeleton-badge"></div></td>
  <td><div class="fx-skeleton fx-skeleton-text" style="width: 50%;"></div></td>
  <td><div class="fx-skeleton fx-skeleton-text" style="width: 80%;"></div></td>
  <td class="text-end"><div class="fx-skeleton fx-skeleton-btn d-inline-block" style="width: 4rem; height: 1.5rem;"></div></td>
</tr>
{% endfor %}
