{% load ui_tags %}
{# Standardized Enterprise ERP Data Table Wrapper Component #}
<div class="card border-0 shadow-sm bg-white overflow-hidden" style="border-radius:10px;">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0 fx-data-table">
      <thead class="table-light text-secondary small text-uppercase fw-semibold border-bottom" style="font-size: 0.75rem; letter-spacing: 0.5px;">
        {% block table_header %}{% endblock %}
      </thead>
      <tbody>
        {% block table_body %}{% endblock %}
      </tbody>
    </table>
  </div>
  {% block table_pagination %}
    {% if page %}
      {% include "components/_pagination.html" %}
    {% endif %}
  {% endblock %}
</div>
