{% with current=request.resolver_match.url_name %}
<nav class="fx-tabs mb-3" aria-label="SLA sections">
  <a role="tab" class="{% if current == 'trackings' or current == 'tracking' %}active{% endif %}" href="{% url 'sla:trackings' %}">
    <i class="bi bi-clock-history me-1"></i>SLA tracking
  </a>
  <a role="tab" class="{% if current == 'breaches' or current == 'breach_ack' %}active{% endif %}" href="{% url 'sla:breaches' %}">
    <i class="bi bi-exclamation-triangle me-1"></i>SLA breaches
    {% if summary.breaches_open %}<span class="badge bg-danger rounded-pill ms-1">{{ summary.breaches_open }}</span>{% elif open_breaches %}<span class="badge bg-danger rounded-pill ms-1">{{ open_breaches }}</span>{% endif %}
  </a>
  {% if can_manage %}
  <a role="tab" class="{% if current == 'profiles' or current == 'profile' or current == 'profile_new' or current == 'profile_edit' or current == 'target_set' or current == 'rule_new' %}active{% endif %}" href="{% url 'sla:profiles' %}">
    <i class="bi bi-shield-check me-1"></i>SLA profiles
  </a>
  {% endif %}
</nav>
{% endwith %}
